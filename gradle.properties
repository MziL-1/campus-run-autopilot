# This repo lives under a non-ASCII Windows path (D:\a校园跑改路径).
# Gradle passes the test-worker classpath to the JVM through an @argfile, and the java
# launcher reads that file with the OS codepage (GBK/CP936 here). The Gradle JVM must
# therefore write it with the same codepage instead of UTF-8, otherwise test classes
# fail with ClassNotFoundException. Keep GBK on this machine.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=GBK
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# Repo path is non-ASCII on Windows; AGP needs this explicit opt-out.
android.overridePathCheck=true
